name: Broker Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: apps/broker test suite (incl. Ledger/Speculos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Broker storage moved from SQLite to Postgres (ephemeral filesystems on
    # Render's free tier wipe a local SQLite file on every redeploy) — the
    # test suite now needs a real reachable Postgres, same as it needs a
    # real Speculos instance below. `services:` containers are exposed on
    # localhost for every step in this job, no extra network setup needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Not a real credential — scoped to this one ephemeral job's
          # throwaway container, torn down when the job ends. Built from a
          # GitHub Actions expression rather than a literal so no
          # password-shaped string ever appears in the committed source
          # (secret scanners can't tell "example"/"CI-only" apart from
          # real from a static literal alone).
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: paybound_broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:${{ github.run_id }}@localhost:5432/paybound_broker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `docker` is preinstalled and running on GitHub-hosted ubuntu-latest
      # runners, so this needs no extra setup: the broker test suite's
      # `globalSetup` (apps/broker/src/__tests__/global-setup.speculos.ts)
      # provisions its own Speculos instance automatically — same as it does
      # on a fresh local checkout — runs the full 77-test suite including
      # the Ledger-backed property tests (task 1.8/3.2), and tears the
      # container down afterward. No manual Speculos setup, here or locally.
      - name: Run broker test suite
        run: pnpm turbo run test --filter=broker
